name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: ["master"]
    paths:
      - "cipher-ui/**"
      - ".github/workflows/azure-frontend-swa.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Azure SWA action builds the app for you.
      # You must create the SWA in Azure Portal first (it gives you the token secret).
      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "cipher-ui"
          output_location: "build"
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
