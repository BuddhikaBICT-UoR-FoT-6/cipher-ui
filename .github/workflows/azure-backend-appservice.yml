name: Deploy Backend to Azure App Service

on:
  push:
    branches: ["master"]
    paths:
      - "backend/**"
      - ".github/workflows/azure-backend-appservice.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Optional: add tests if you have them
      - name: Backend tests
        working-directory: backend
        run: npm test --if-present

      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../backend.zip .

      # This uses a Publish Profile secret (easiest).
      # In Azure Portal -> App Service -> Get publish profile -> add it as a repo secret.
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip
